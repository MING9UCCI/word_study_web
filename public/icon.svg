<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="115" fill="url(#grad)"/>
  
  <!-- Book/V icon -->
  <g transform="translate(100, 100)">
    <!-- Left page -->
    <path d="M 50 80 L 50 280 L 156 300 L 156 100 Z" fill="white" opacity="0.9"/>
    <!-- Right page -->
    <path d="M 156 100 L 156 300 L 262 280 L 262 80 Z" fill="white" opacity="0.95"/>
    <!-- V shape overlay -->
    <path d="M 80 120 L 156 240 L 232 120" stroke="white" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Book spine -->
    <rect x="152" y="100" width="8" height="200" fill="white" opacity="0.7"/>
  </g>
</svg>
